<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#101923"><title>Selah — Projector</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet"><style>*{box-sizing:border-box}body{margin:0;background:#101923;color:#eee8dc;min-height:100vh;font-family:'DM Sans',Arial,sans-serif}.slide{min-height:100vh;padding:5vh 6vw;display:flex;flex-direction:column;justify-content:space-between;background:radial-gradient(ellipse at 50% 45%,#263b4a,#101923 73%);transition:background .3s}header,footer{display:flex;justify-content:space-between;align-items:center;color:#c6b58e;letter-spacing:.2em;font-size:clamp(10px,1.2vw,15px)}header span:last-child{color:#87c69b}.body{align-self:center;max-width:1500px;text-align:center}.verse{font:500 clamp(32px,5vw,72px)/1.42 'Playfair Display',Georgia,serif}.reference{margin-top:4vh;color:#dfbb7b;letter-spacing:.16em;font:500 clamp(14px,1.7vw,23px) 'DM Sans',Arial,sans-serif}.copyright{margin-top:10px;color:#a89e8c;font:12px/1.35 'DM Sans',Arial,sans-serif;letter-spacing:0}.version{color:#bdb5a6;font-size:clamp(10px,1vw,14px);letter-spacing:.14em;margin-top:12px}.multi{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:2vw;width:100%;max-width:1600px}.multi-card{border-left:1px solid #c0a77577;padding:0 2vw;text-align:left}.multi-card .verse{font-size:clamp(17px,2vw,32px);line-height:1.4}.multi-card .version{margin:0 0 14px}.multi-card:first-child{border:0}footer{font-size:clamp(9px,.9vw,12px);color:#a89e8c}button{position:fixed;right:12px;bottom:12px;opacity:.18;background:#263640;color:white;border:0;border-radius:5px;padding:7px;cursor:pointer}button:hover{opacity:1}.hidden{display:none!important}@media(max-width:700px){.multi{display:block}.multi-card{border:0;border-top:1px solid #c0a77577;padding:2vh 0}.multi-card .verse{font-size:20px}}
</style></head><body><div class="slide" id="slide"><header><span>✳ <b id="church-name">YOUR CHURCH</b></span><span>● LIVE SCRIPTURE</span></header><div class="body"><div id="single"><div id="verse" class="verse">For where two or three are gathered together in my name, there am I in the midst of them.</div><div id="ref" class="reference">MATTHEW 18:20</div><div id="version" class="version">KING JAMES VERSION</div><div id="copyright" class="copyright"></div></div><div id="multi" class="multi hidden"></div></div><footer><span>SELAH · LIVE SCRIPTURE</span><span id="footer-ref">MATTHEW 18:20</span></footer></div><button onclick="document.documentElement.requestFullscreen()">Fullscreen</button><script>
function update(d){if(!d)return;const church=document.querySelector('#church-name');if(church)church.textContent=(d.churchName||'Your church').toUpperCase();const ref=d.ref||'';document.querySelector('#footer-ref').textContent=ref.toUpperCase();if(d.sideBySide&&d.versions?.length){document.querySelector('#single').classList.add('hidden');const multi=document.querySelector('#multi');multi.classList.remove('hidden');multi.innerHTML='';for(const v of d.versions){const card=document.createElement('div');card.className='multi-card';const name=document.createElement('div');name.className='version';name.textContent=v.name;const text=document.createElement('div');text.className='verse';text.textContent='“'+v.text+'”'+(v.citation||'');card.append(name,text);if(v.copyright){const credit=document.createElement('div');credit.className='copyright';credit.textContent=v.copyright;card.append(credit)}multi.append(card)}}else{document.querySelector('#multi').classList.add('hidden');document.querySelector('#single').classList.remove('hidden');document.querySelector('#verse').textContent='“'+(d.verse||'')+'”'+(d.citation||'');document.querySelector('#ref').textContent=ref.toUpperCase();document.querySelector('#version').textContent=(d.versionName||d.version||'').toUpperCase();document.querySelector('#copyright').textContent=d.copyright||''}}
try{update(JSON.parse(localStorage.getItem('selah.projector')))}catch{}window.addEventListener('storage',e=>{if(e.key==='selah.projector')try{update(JSON.parse(e.newValue))}catch{}});window.addEventListener('message',e=>{if(e.data?.type==='selah-verse')update(e.data.data)});setInterval(()=>{try{update(JSON.parse(localStorage.getItem('selah.projector')))}catch{}},1300);window.addEventListener('keydown',e=>{if(e.key.toLowerCase()==='f')document.documentElement.requestFullscreen()});
</script></body></html>
